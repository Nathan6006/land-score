[project]
name = "landscore"
version = "0.1.0"
description = "Land Score: tree establishment potential for offered plots in Northeast Ohio (Roots of Tomorrow)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "geopandas>=1.0",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    "shap>=0.46",
]

[project.scripts]
landscore = "landscore.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landscore"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs internet access (skipped unless LANDSCORE_NETWORK_TESTS=1)",
]
